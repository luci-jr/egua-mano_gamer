<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Égua Mano! Gamer - Uma Aventura em Belém do Pará</title>
  
  <!-- Favicon & PWA Manifest -->
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <link rel="shortcut icon" href="assets/favicon.ico">
  <link rel="apple-touch-icon" href="assets/favicon.png">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#facc15">

  <!-- Estilos Modulares (Clean Architecture) -->
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/controls.css">
  <link rel="stylesheet" href="css/mobile.css">

  <!-- Runtime Oficial WebAssembly Go -->
  <script src="wasm_exec.js"></script>
</head>
<body>
  <!-- Tela de Carregamento -->
  <div id="loading">
    <div class="spinner"></div>
    <p>Carregando Égua Mano!...</p>
  </div>

  <!-- Controles Virtuais Estilo NES Retrô (Mobile / Tablet) -->
  <div id="touch-controls">
    <!-- D-Pad Clássico com Deslize Suave -->
    <div class="nes-dpad-container" id="nes-dpad">
      <div class="nes-dpad-cross">
        <div class="nes-dpad-arm nes-dpad-up" id="btn-dpad-up">▲</div>
        <div class="nes-dpad-arm nes-dpad-down" id="btn-dpad-down">▼</div>
        <div class="nes-dpad-arm nes-dpad-left" id="btn-dpad-left">◀</div>
        <div class="nes-dpad-arm nes-dpad-right" id="btn-dpad-right">▶</div>
        <div class="nes-dpad-center"></div>
      </div>
    </div>

    <!-- Botões Centrais (Select / Start) -->
    <div class="nes-center-panel">
      <div class="nes-pill-group">
        <div class="nes-pill-btn" id="btn-touch-select"></div>
        <span class="nes-pill-text">SELECT</span>
      </div>
      <div class="nes-pill-group">
        <div class="nes-pill-btn" id="btn-touch-start"></div>
        <span class="nes-pill-text">START</span>
      </div>
    </div>

    <!-- Botões de Ação NES (B / A) -->
    <div class="nes-action-panel">
      <div class="nes-btn-wrapper">
        <div class="nes-round-btn nes-btn-b" id="btn-touch-b">
          <span class="nes-btn-letter">B</span>
        </div>
        <span class="nes-btn-action-label">ATACAR</span>
      </div>
      <div class="nes-btn-wrapper">
        <div class="nes-round-btn nes-btn-a" id="btn-touch-a">
          <span class="nes-btn-letter">A</span>
        </div>
        <span class="nes-btn-action-label">PULAR</span>
      </div>
    </div>

    <!-- Botão de Pausa Superior -->
    <div class="touch-top-bar">
      <button class="touch-btn-top" id="btn-touch-pause">⏸ PAUSA</button>
    </div>
  </div>

  <!-- Barra de Curiosidades Culturais de Belém do Pará -->
  <div id="trivia-bar">
    <span class="trivia-badge">BELÉM</span>
    <span id="trivia-text">O Mercado do Ver-o-Peso (1627) é a maior feira a céu aberto da América Latina!</span>
  </div>

  <!-- Barra de Instruções para Desktop -->
  <div id="controls-bar">
    <kbd>ENTER</kbd> Selecionar | <kbd>← / →</kbd> Mover | <kbd>W / ↑</kbd> Pular (2x) | <kbd>ESPAÇO / X</kbd> Atacar | <kbd>S / ↓</kbd> Abaixar | <kbd>ESC</kbd> Pausa
  </div>

  <!-- Scripts Modulares (Clean Architecture) -->
  <script src="js/audio-manager.js"></script>
  <script src="js/controls.js"></script>
  <script src="js/trivia.js"></script>
  <script src="js/wasm-loader.js"></script>
</body>
</html>

name: Publicar no GitHub Pages

# Compila o jogo para WebAssembly e publica o site a cada push na main.
# Com isto o binário (game.dat) não precisa mais ser commitado.
#
# Para ativar: Settings → Pages → Build and deployment → Source: "GitHub Actions".

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Compilar para WebAssembly
        run: GOOS=js GOARCH=wasm go build -ldflags="-s -w" -o game.wasm .

      - name: Montar o site
        run: |
          mkdir -p _site
          # Páginas e imagens estáticas que hoje vivem em docs/
          cp docs/index.html docs/manifest.json _site/
          cp -r docs/assets _site/assets
          touch _site/.nojekyll
          # wasm_exec.js precisa ser o da MESMA versão do Go que compilou o jogo
          cp "$(go env GOROOT)/lib/wasm/wasm_exec.js" _site/wasm_exec.js
          # index.html carrega game.dat (o WASM compactado com gzip)
          gzip -9 -c game.wasm > _site/game.dat
          ls -la _site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
